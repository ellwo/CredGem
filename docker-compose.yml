services:  
  postgres:
    container_name: "postgres-container-credgem"
    image: "postgres:16"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-credgem}
    # Remove port exposure in production - only accessible via internal network
    # ports:
    #   - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "postgresdata:/var/lib/postgresql/data"
    networks:
      - "mynetwork"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: "redis-container-credgem"
    image: "redis:7.2"
    # Remove port exposure in production - only accessible via internal network
    # ports:
    #   - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - "redisdata:/data"
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
        redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
      else
        redis-server --appendonly yes;
      fi"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - "mynetwork"
    restart: unless-stopped
    healthcheck:
      test: >
        sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-cli -a \"$$REDIS_PASSWORD\" ping;
        else
          redis-cli ping;
        fi"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: "server-container-credgem"
    # Remove direct port exposure - access via nginx only
    # ports:
    #   - "127.0.0.1:${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres-container-credgem
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-credgem}
      - REDIS_URL=${REDIS_URL:-redis://redis-container-credgem:${REDIS_PORT:-6379}}
      - ENV=prod
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    networks:
      - "mynetwork"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  admin-panel:
    build: 
      context: ./admin-panel
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: "admin-panel-container-credgem"
    # Remove direct port exposure - access via nginx only
    # ports:
    #   - "127.0.0.1:${ADMIN_PANEL_PORT:-3000}:3000"
    volumes:
      - "adminpanel_static:/app/static"
    depends_on:
      - server
    networks:
      - "mynetwork"
    restart: unless-stopped

  nginx:
    image: nginx
    container_name: "nginx-container-credgem"
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - "adminpanel_static:/usr/share/nginx/html:ro"
      - "nginx_logs:/var/log/nginx"
    depends_on:
      - server
      - admin-panel
    networks:
      - "mynetwork"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgresdata:
  redisdata:
  adminpanel_static:
  nginx_logs:

networks:
  mynetwork:
    driver: bridge